[workspace]
resolver = "3"
# Globs, so that a new crate or plugin only needs its own directory.
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.1-beta"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Patryk Skoczylas"]
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
argon2 = "0.5"
bcrypt = "0.17"
hmac = "0.12"
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
pumbo-common = { git = "https://github.com/PumboMC/PumboProx" }
pumbo-auth-core = { path = "crates/pumbo-auth-core" }
pumbo-sdk = { git = "https://github.com/PumboMC/PumboProx" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
