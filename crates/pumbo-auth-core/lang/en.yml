# PumboAuth messages (English).
# Replies get the plugin prefix and the colour of their tone from the plugin, so
# they are written without either; &f...&r highlights a value. Kicks, titles and
# the countdown bar are shown as written (& colour codes). {0}, {1}, ... are
# arguments, {nl} starts a new line. An empty value disables a message.

