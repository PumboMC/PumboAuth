[package]
name = "pumbo-auth-pumpkin"
# The PumboAuth product version (not the workspace version of the crates).
version = "0.1.1-beta"
description = "PumboAuth: accounts for the Pumpkin Minecraft server (register, log in, premium, two-factor login, sessions)"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mc263"]
# Pumpkin 0.2.0 (Minecraft 26.3).
mc263 = ["dep:api263"]
# Pumpkin 0.1.0-dev (Minecraft 26.2).
mc262 = ["dep:api262"]

[dependencies]
pumbo-common.workspace = true
pumbo-auth-core.workspace = true
serde.workspace = true

# The plugin API only exists inside the WebAssembly component; natively the
# crate builds without it, so its pure parts are tested with `cargo test`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
api263 = { package = "pumpkin-plugin-api", version = "=0.2.0", optional = true }
# 0.1.0-dev+26.2-26.45 (the build metadata is not part of the requirement)
api262 = { package = "pumpkin-plugin-api", version = "=0.1.0-dev", optional = true }

[lints]
workspace = true
