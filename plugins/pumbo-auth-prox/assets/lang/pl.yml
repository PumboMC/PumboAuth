# --- auth ---
# Komunikaty PumboAuth (polski).
# Odpowiedzi dostają prefiks i kolor tonu od wtyczki, więc są pisane bez nich;
# &f...&r wyróżnia wartość. Kicki, tytuły i pasek odliczania są pokazywane tak,
# jak są napisane (kody kolorów &). {0}, {1}, ... to argumenty, {nl} zaczyna
# nową linię. Pusta wartość wyłącza komunikat.

