[package]
name = "pumbo-auth-prox"
description = "PumboAuth for the PumboProx proxy: one account per player for the whole network, logged in before any server sees them"
# Product version of PumboAuth on PumboProx (the core crates share the workspace version).
version = "0.1.2-beta"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pumbo-common.workspace = true
pumbo-auth-core.workspace = true
pumbo-sdk.workspace = true
serde.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
